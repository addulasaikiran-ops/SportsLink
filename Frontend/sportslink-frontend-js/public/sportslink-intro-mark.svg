<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
<title id="title">SPORTSLINK</title><desc id="desc">SPORTSLINK wordmark with a blue S frame connected by a line to a lime L frame.</desc>
<defs>
 <linearGradient id="sStroke" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2F6BFF"/><stop offset="1" stop-color="#8FB4FF"/></linearGradient>
 <linearGradient id="linkLine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2F6BFF"/><stop offset=".58" stop-color="#8FB4FF"/><stop offset="1" stop-color="#70D522"/></linearGradient>
</defs>
<!-- Connecting line is the visual spine of the identity. -->
<path d="M84 120H1032" fill="none" stroke="url(#linkLine)" stroke-width="5" stroke-linecap="round"/>
<rect x="18" y="27" width="150" height="186" rx="27" fill="#07152D" stroke="url(#sStroke)" stroke-width="10"/>
