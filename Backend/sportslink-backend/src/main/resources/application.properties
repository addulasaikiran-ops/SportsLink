spring.application.name=sportslink-backend

# Supabase Auth JWT verification. This is the public JWKS endpoint, not a secret key.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://ozqitjwttigfpmnroeqi.supabase.co/auth/v1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://ozqitjwttigfpmnroeqi.supabase.co/auth/v1/.well-known/jwks.json

# Override this environment variable when the frontend has a different origin.
sportslink.cors.allowed-origin=${SPORTSLINK_CORS_ALLOWED_ORIGIN:http://localhost:3000}
