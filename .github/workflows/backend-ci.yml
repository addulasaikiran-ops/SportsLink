name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "Backend/sportslink-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Backend/sportslink-backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test Spring Boot backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/sportslink-backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: gradle build
