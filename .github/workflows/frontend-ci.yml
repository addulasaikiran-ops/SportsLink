name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "Frontend/sportslink-frontend-js/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Frontend/sportslink-frontend-js/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Next.js frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/sportslink-frontend-js

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://project-ref.example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_USE_SPRING_API: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/sportslink-frontend-js/package-lock.json

      # Resolve the Nexconn dependency tree, commit only the lockfile if it changed,
      # then prove the committed lockfile supports a clean deterministic install.
      - name: Resolve dependencies
        run: npm install --no-audit --no-fund

      - name: Commit generated package lockfile
        run: |
          if ! git diff --quiet -- Frontend/sportslink-frontend-js/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Frontend/sportslink-frontend-js/package-lock.json
            git commit -m "chore: update frontend lockfile for Nexconn"
            git push origin HEAD
          fi

      - name: Verify clean install
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Upload generated npm lockfile for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sportslink-frontend-package-lock
          path: Frontend/sportslink-frontend-js/package-lock.json
          if-no-files-found: error
          retention-days: 3
