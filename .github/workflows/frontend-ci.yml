name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "Frontend/sportslink-frontend-js/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Frontend/sportslink-frontend-js/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Next.js frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/sportslink-frontend-js

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://project-ref.example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_build_placeholder
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_USE_SPRING_API: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Frontend/sportslink-frontend-js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run feed interaction contract tests
        run: npm test

      - name: Build frontend
        run: npm run build
