name: Build SPORTSLINK Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/sportslink-frontend-js
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Install Capacitor tooling for this CI build
        run: npm install --no-save @capacitor/core@^7.4.3 @capacitor/android@^7.4.3 @capacitor/cli@^7.4.3

      - name: Generate Android project
        run: npx cap add android

      - name: Apply SPORTSLINK launcher icon
        run: |
          npm install --no-save @capacitor/assets
          mkdir -p assets
          cp public/favicon_tag_pro_SL_ghost.png assets/icon.png
          npx capacitor-assets generate --android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sportslink-android-debug-apk
          path: Frontend/sportslink-frontend-js/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
