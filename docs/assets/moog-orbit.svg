<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" role="img" aria-labelledby="t d"><title id="t">Moog Bots orbiting a sports ball</title><desc id="d">A yellow ball bounces across a pink and grey orbit while tiny bots hop around it.</desc><rect width="1000" height="170" rx="22" fill="#FFF9E8"/><path d="M90 110 Q500 8 910 110" fill="none" stroke="#D8CDD1" stroke-width="3" stroke-dasharray="8 10"/><g><circle cx="500" cy="84" r="36" fill="#FFD84D" stroke="#55545C" stroke-width="4"/><path d="M500 48 Q470 68 482 98 Q500 117 518 98 Q530 68 500 48 M464 77 L485 80 M515 88 L536 91" fill="none" stroke="#55545C" stroke-width="3"/><animateTransform attributeName="transform" type="translate" values="0 0;0 -13;0 0" dur="1.1s" repeatCount="indefinite"/></g><g fill="#F7B8D0" stroke="#55545C" stroke-width="3"><rect x="220" y="74" width="42" height="42" rx="9"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="1.3s" repeatCount="indefinite"/></rect><rect x="738" y="74" width="42" height="42" rx="9"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="1.3s" begin=".6s" repeatCount="indefinite"/></rect></g><g fill="#55545C"><circle cx="232" cy="88" r="3"/><circle cx="249" cy="88" r="3"/><circle cx="750" cy="88" r="3"/><circle cx="767" cy="88" r="3"/></g><text x="500" y="151" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#55545C" text-anchor="middle">PASS THE ENERGY · KEEP THE NETWORK MOVING</text><style>@media(prefers-reduced-motion:reduce){animateTransform{display:none}}</style></svg>