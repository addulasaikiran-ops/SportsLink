<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" role="img" aria-labelledby="t d"><title id="t">SPORTSLINK architecture</title><desc id="d">Next.js sends the caller's Supabase JWT to Spring Boot. Spring validates it and forwards caller identity to Supabase REST and Postgres RLS.</desc><defs><style>@keyframes flow{to{stroke-dashoffset:-36}}.flow{stroke-dasharray:7 9;animation:flow 1.6s linear infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1100" height="300" rx="12" fill="#0b0f14"/><g font-family="monospace" text-anchor="middle"><rect x="35" y="65" width="260" height="105" rx="8" fill="#101D2A" stroke="#39E7D5" stroke-width="2"/><text x="165" y="99" fill="#39E7D5" font-size="21">NEXT.JS</text><text x="165" y="125" fill="#F4F7FB" font-size="13">Browser + Supabase session</text><text x="165" y="146" fill="#A8B4C2" font-size="11">Bearer caller JWT</text><rect x="420" y="65" width="260" height="105" rx="8" fill="#211A31" stroke="#B49AFF" stroke-width="2"/><text x="550" y="99" fill="#B49AFF" font-size="21">SPRING BOOT</text><text x="550" y="125" fill="#F4F7FB" font-size="13">JWT resource server</text><text x="550" y="146" fill="#A8B4C2" font-size="11">signature / issuer / expiry</text><rect x="805" y="65" width="260" height="105" rx="8" fill="#18291D" stroke="#8EE36B" stroke-width="2"/><text x="935" y="99" fill="#8EE36B" font-size="21">SUPABASE</text><text x="935" y="125" fill="#F4F7FB" font-size="13">REST + Postgres</text><text x="935" y="146" fill="#A8B4C2" font-size="11">RLS policies</text><path class="flow" d="M295 117H420M680 117H805" stroke="#FFD84D" stroke-width="4"/><rect x="340" y="107" width="20" height="20" fill="#FFD84D"/><rect x="720" y="107" width="20" height="20" fill="#FFD84D"/><text x="550" y="213" fill="#FF985C" font-size="14">MECHANIC BOT · API / GRADLE / CI</text><text x="550" y="241" fill="#A8B4C2" font-size="12">/api/profiles/me · /api/posts · /api/conversations · /api/opportunities</text><text x="550" y="270" fill="#A8B4C2" font-size="11">Caller token forwarded; no service-role key in this request path.</text></g></svg>