 <g class="ball" transform="translate(190 220)"><circle r="27" fill="#fff" stroke="#d6d1d1" stroke-width="2"/><path d="M-7-11L6-17L17-5L12 10H-7L-15-3Z" fill="#34323b"/><path d="M-15-3l-10-5M12 10l9 8M-7 10l-7 12" stroke="#34323b" stroke-width="5" stroke-linecap="round"/></g>
 <g class="blink" fill="#ffd84d"><path d="M185 159l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/></g>
</g>
