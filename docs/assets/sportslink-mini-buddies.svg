<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
<title id="title">SPORTSLINK mini sports buddies</title>
<desc id="desc">Four small cream fox mascots on a transparent background: one plays football, one checks a phone, and two play basketball together.</desc>
<defs>
 <linearGradient id="fur" x1="0" y1="0" x2="0.9" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#eadfd2"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe77a"/><stop offset="1" stop-color="#ffbd16"/></linearGradient>
 <linearGradient id="hood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4b4853"/><stop offset="1" stop-color="#292832"/></linearGradient>
 <filter id="soft" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#6b5c4b" flood-opacity=".14"/></filter>
 <style>
 .buddy{transform-box:fill-box;transform-origin:center;animation:bob 2.5s ease-in-out infinite}
 .phone{transform-box:fill-box;transform-origin:center;animation:phone 2s ease-in-out infinite}
 .kick{transform-box:fill-box;transform-origin:center;animation:kick 1.1s ease-in-out infinite}
 .ball{transform-box:fill-box;transform-origin:center;animation:roll 1.6s ease-in-out infinite}
 .bounce{transform-box:fill-box;transform-origin:center;animation:bounce .8s ease-in-out infinite}
 .blink{animation:twinkle 2.5s ease-in-out infinite}
 @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
 @keyframes phone{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}
 @keyframes kick{0%,100%{transform:rotate(0)}45%{transform:rotate(-9deg)}}
 @keyframes roll{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(12px,-7px) rotate(90deg)}}
 @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
 @keyframes twinkle{0%,100%{opacity:.45}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.buddy,.phone,.kick,.ball,.bounce,.blink{animation:none}}
 </style>
</defs>
<!-- 1: football buddy -->
<g class="buddy" transform="translate(135 40)" filter="url(#soft)">
 <ellipse cx="82" cy="268" rx="66" ry="8" fill="#b7a89b" opacity=".18"/>
