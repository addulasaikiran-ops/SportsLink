 <g class="phone" transform="translate(115 120) rotate(10)"><rect x="0" y="0" width="38" height="62" rx="7" fill="#25242d" stroke="#ffca27" stroke-width="2"/><rect x="4" y="7" width="30" height="47" rx="3" fill="#f7e9d8"/><path d="M14 25l6-4 6 4-6 4z" fill="#ffd84d"/><path d="M20 23v13" stroke="#ffd84d" stroke-width="3"/><circle cx="19" cy="58" r="1.5" fill="#fff"/></g>
</g>
