<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">SPORTSLINK Bot Squad — animated transparent pixel-art banner</title>
<desc id="desc">Twelve original tiny voxel robots bounce and play together above a simple grassy strip. A pixel football passes across the group. No stadium or boxed background is used.</desc>
