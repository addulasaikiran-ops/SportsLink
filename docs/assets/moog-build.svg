<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">Ru keeps the build moving.</title><desc id="d">Four visual stages inspired by the repository workflows; the art itself does not run CI.</desc><defs><style>
 :root{color-scheme:light} .bg{fill:#FFF9E8} .card{fill:#FFFFFF;stroke:#E7DDE2;stroke-width:2}.ink{fill:#55545C} .muted{fill:#77717A} .lime{fill:#FFD84D}.shell{fill:#55545C}.side{fill:#777780}.face{fill:#F7B8D0}.eye{fill:#FFD84D}.bot{transform-box:fill-box;transform-origin:center bottom;animation:hop 3s cubic-bezier(.4,0,.2,1) infinite}.bot:nth-of-type(2){animation-delay:.35s}.shadow{fill:#C8C4C8;animation:shade 3s ease-in-out infinite}.float{animation:float 4s ease-in-out infinite}.pulse{animation:pulse 3s ease-in-out infinite}.spark{animation:spark 3s ease-in-out infinite}.label{font:700 17px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1px}.headline{font:800 30px ui-sans-serif,system-ui,sans-serif}.caption{font:500 16px ui-sans-serif,system-ui,sans-serif}
 @keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(4px) scale(1.14,.78)}28%{transform:translateY(-44px) scale(.88,1.15)}44%{transform:translateY(-56px) scale(1,1)}61%{transform:translateY(-18px) scale(1.06,.94)}72%{transform:translateY(0) scale(1.13,.8)}84%{transform:translateY(-7px) scale(.96,1.04)}} @keyframes shade{0%,100%{transform:scaleX(1);opacity:.55}30%,50%{transform:scaleX(.55);opacity:.22}} @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}} @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}} @keyframes spark{0%,100%{opacity:.15;transform:translateY(5px)}50%{opacity:1;transform:translateY(-5px)}} @media(prefers-reduced-motion:reduce){.bot,.shadow,.float,.pulse,.spark{animation:none!important}}
 </style></defs><rect class="bg" width="1200" height="420" rx="26"/><g opacity=".45" fill="#E7DDE2"><circle cx="74" cy="54" r="3"/><circle cx="1100" cy="68" r="4"/><circle cx="1060" cy="350" r="3"/><circle cx="130" cy="342" r="4"/><path d="M40 95h112M1040 112h110M65 315h90M1030 300h105" stroke="#E7DDE2" stroke-width="2" stroke-dasharray="4 8"/></g>
