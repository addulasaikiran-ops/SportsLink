<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 220" role="img" aria-labelledby="t d"><title id="t">SPORTSLINK member journey relay</title><desc id="d">Sign up, onboarding, profile, follow, post, apply, message and alert. Scout, Recruiter and Courier bots pass a glowing pixel baton.</desc><defs><style>@keyframes baton{0%{transform:translateX(0)}100%{transform:translateX(900px)}}@keyframes bob{50%{transform:translateY(-4px)}}.baton{animation:baton 7s linear infinite}.bot{animation:bob 1.3s steps(3,end) infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1100" height="220" rx="12" fill="#0b0f14"/><path d="M55 105H1040" stroke="#34414D" stroke-width="4"/><path d="M55 105H1040" stroke="#FFD84D" stroke-width="2" stroke-dasharray="5 9"/><g><circle cx="75" cy="105" r="18" fill="#101D2A" stroke="#39E7D5" stroke-width="2"/><text x="75" y="143" text-anchor="middle" fill="#F4F7FB" font-family="monospace" font-size="10">SIGN UP</text></g><g><circle cx="210" cy="105" r="18" fill="#101D2A" stroke="#39E7D5" stroke-width="2"/><text x="210" y="143" text-anchor="middle" fill="#F4F7FB" font-family="monospace" font-size="10">ONBOARD</text></g><g><circle cx="345" cy="105" r="18" fill="#101D2A" stroke="#39E7D5" stroke-width="2"/><text x="345" y="143" text-anchor="middle" fill="#F4F7FB" font-family="monospace" font-size="10">PROFILE</text></g><g><circle cx="480" cy="105" r="18" fill="#101D2A" stroke="#39E7D5" stroke-width="2"/><text x="480" y="143" text-anchor="middle" fill="#F4F7FB" font-family="monospace" font-size="10">FOLLOW</text></g><g><circle cx="615" cy="105" r="18" fill="#101D2A" stroke="#B49AFF" stroke-width="2"/><text x="615" y="143" text-anchor="middle" fill="#F4F7FB" font-family="monospace" font-size="10">POST</text></g><g><circle cx="750" cy="105" r="18" fill="#101D2A" stroke="#FFD84D" stroke-width="2"/><text x="750" y="143" text-anchor="middle" fill="#F4F7FB" font-family="monospace" font-size="10">APPLY</text></g><g><circle cx="885" cy="105" r="18" fill="#101D2A" stroke="#FF6EA8" stroke-width="2"/><text x="885" y="143" text-anchor="middle" fill="#F4F7FB" font-family="monospace" font-size="10">MESSAGE</text></g><g><circle cx="1020" cy="105" r="18" fill="#101D2A" stroke="#8EE36B" stroke-width="2"/><text x="1020" y="143" text-anchor="middle" fill="#F4F7FB" font-family="monospace" font-size="10">ALERT</text></g><g class="bot" transform="translate(325 30)"><rect width="22" height="27" fill="#176B68"/><rect x="3" y="3" width="16" height="21" fill="#39E7D5"/><rect x="6" y="9" width="3" height="3" fill="#0b0f14"/><rect x="13" y="9" width="3" height="3" fill="#0b0f14"/></g><text x="336" y="72" text-anchor="middle" fill="#39E7D5" font-family="monospace" font-size="10">SCOUT</text><g class="bot" transform="translate(720 30)"><rect width="22" height="27" fill="#8A6818"/><rect x="3" y="3" width="16" height="21" fill="#FFD84D"/><rect x="6" y="9" width="3" height="3" fill="#0b0f14"/><rect x="13" y="9" width="3" height="3" fill="#0b0f14"/></g><text x="731" y="72" text-anchor="middle" fill="#FFD84D" font-family="monospace" font-size="10">RECRUITER</text><g class="bot" transform="translate(855 30)"><rect width="22" height="27" fill="#873C67"/><rect x="3" y="3" width="16" height="21" fill="#FF6EA8"/><rect x="6" y="9" width="3" height="3" fill="#0b0f14"/><rect x="13" y="9" width="3" height="3" fill="#0b0f14"/></g><text x="866" y="72" text-anchor="middle" fill="#FF6EA8" font-family="monospace" font-size="10">COURIER</text><g class="baton"><rect x="55" y="99" width="12" height="12" fill="#FFD84D" stroke="#FFF2B2" stroke-width="2"/></g><text x="550" y="190" text-anchor="middle" fill="#A8B4C2" font-family="monospace" font-size="12">PROFILE → CONNECTIONS → COMMUNITY → OPPORTUNITIES</text></svg>