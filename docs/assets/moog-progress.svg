<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" role="img" aria-labelledby="t d"><title id="t">Moog Bots progress parade</title><desc id="d">Five yellow, pink and grey blocks hop in sequence along a progress track.</desc><rect width="1000" height="150" rx="22" fill="#FFF9E8"/><path d="M90 94H910" stroke="#D8CDD1" stroke-width="8" stroke-linecap="round"/><g stroke="#55545C" stroke-width="3"><rect x="145" y="58" width="44" height="44" rx="10" fill="#FFD84D"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" dur="1.25s" repeatCount="indefinite"/></rect><rect x="315" y="58" width="44" height="44" rx="10" fill="#F7B8D0"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" begin=".2s" dur="1.25s" repeatCount="indefinite"/></rect><rect x="485" y="58" width="44" height="44" rx="10" fill="#777780"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" begin=".4s" dur="1.25s" repeatCount="indefinite"/></rect><rect x="655" y="58" width="44" height="44" rx="10" fill="#FFD84D"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" begin=".6s" dur="1.25s" repeatCount="indefinite"/></rect><rect x="825" y="58" width="44" height="44" rx="10" fill="#F7B8D0"><animateTransform attributeName="transform" type="translate" values="0 0;0 -18;0 0" begin=".8s" dur="1.25s" repeatCount="indefinite"/></rect></g><style>@media(prefers-reduced-motion:reduce){animateTransform{display:none}}</style></svg>