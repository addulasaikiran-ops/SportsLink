<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 86" role="img" aria-labelledby="t d"><title id="t">SPORTSLINK value statements</title><desc id="d">Animated sequence: connect with your sporting world, discover people and opportunities, build your professional presence, move sport forward together.</desc><rect width="1000" height="86" rx="18" fill="#102d50"/><g fill="#fff" text-anchor="middle" font-family="Arial" font-size="30" font-weight="800"><text x="500" y="54">CONNECT WITH YOUR SPORTING WORLD<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.78;1" dur="12s" repeatCount="indefinite"/></text><text x="500" y="54" opacity="0">DISCOVER PEOPLE AND OPPORTUNITIES<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.78;1" begin="3s" dur="12s" repeatCount="indefinite"/></text><text x="500" y="54" opacity="0">BUILD YOUR PROFESSIONAL PRESENCE<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.78;1" begin="6s" dur="12s" repeatCount="indefinite"/></text><text x="500" y="54" opacity="0">MOVE SPORT FORWARD — TOGETHER<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.78;1" begin="9s" dur="12s" repeatCount="indefinite"/></text></g><path d="M70 68H930" stroke="#70d522" stroke-width="3" stroke-dasharray="100 900"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="12s" repeatCount="indefinite"/></path><style>@media(prefers-reduced-motion:reduce){animate{display:none}}</style></svg>