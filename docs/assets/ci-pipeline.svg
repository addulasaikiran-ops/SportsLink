<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" role="img" aria-labelledby="t d"><title id="t">SPORTSLINK CI pipeline</title><desc id="d">Mechanic Bot pushes a pixel cube through backend CI, frontend CI and a manually triggered Android debug APK build, ending in an APK trophy.</desc><defs><style>@keyframes cube{to{transform:translateX(760px)}}@keyframes bob{50%{transform:translateY(-3px)}}.cube{animation:cube 6s linear infinite}.bot{animation:bob 1.5s steps(3,end) infinite}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="1100" height="250" rx="12" fill="#0b0f14"/><path d="M50 157H1040" stroke="#34414D" stroke-width="8"/><path d="M50 157H1040" stroke="#FF985C" stroke-width="2" stroke-dasharray="7 10"/><g font-family="monospace" text-anchor="middle"><rect x="200" y="63" width="180" height="65" rx="6" fill="#171D25" stroke="#FF985C" stroke-width="2"/><text x="290" y="90" fill="#FF985C" font-size="14">BACKEND CI</text><text x="290" y="110" fill="#A8B4C2" font-size="10">Gradle build + tests</text><rect x="430" y="63" width="180" height="65" rx="6" fill="#171D25" stroke="#39E7D5" stroke-width="2"/><text x="520" y="90" fill="#39E7D5" font-size="14">FRONTEND CI</text><text x="520" y="110" fill="#A8B4C2" font-size="10">npm build</text><rect x="660" y="63" width="180" height="65" rx="6" fill="#171D25" stroke="#B49AFF" stroke-width="2"/><text x="750" y="90" fill="#B49AFF" font-size="14">BUILD APK</text><text x="750" y="110" fill="#A8B4C2" font-size="10">Manual debug artifact</text><path d="M930 65h65v48q-32 30-65 0z" fill="#FFD84D" stroke="#FFF2B2" stroke-width="3"/><text x="962" y="95" fill="#0b0f14" font-size="13" font-weight="900">APK</text><text x="962" y="140" fill="#FFD84D" font-size="11">ARTIFACT</text></g><g class="bot" transform="translate(55 112)"><rect width="26" height="36" fill="#914D2A"/><rect x="3" y="3" width="20" height="30" fill="#FF985C"/><rect x="6" y="10" width="4" height="4" fill="#0b0f14"/><rect x="16" y="10" width="4" height="4" fill="#0b0f14"/></g><g class="cube"><rect x="90" y="145" width="20" height="20" fill="#FFD84D" stroke="#FFF2B2" stroke-width="2"/><path d="m90 145 10-6 10 6-10 6z" fill="#FFF2B2"/></g><text x="550" y="213" text-anchor="middle" fill="#A8B4C2" font-family="monospace" font-size="11">MAIN: BACKEND + FRONTEND CI · ANDROID: MANUAL DISPATCH</text></svg>