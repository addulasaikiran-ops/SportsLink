<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">SPORTSLINK application architecture</title><desc id="d">An isometric-style diagram of Next.js frontend, optional Spring Boot API, Supabase Auth/Postgres with row-level security, Railway deployment, GitHub Actions CI, and Nexconn chat.</desc><defs><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000" flood-opacity=".17"/></filter><marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="#70d522"/></marker></defs><rect width="1200" height="700" rx="28" fill="#f4f8fb"/><g font-family="Arial"><text x="56" y="70" font-size="16" font-weight="900" letter-spacing="4" fill="#70b91c">PLATFORM MAP</text><text x="56" y="112" font-size="33" font-weight="900" fill="#102d50">One product. Connected services.</text><g filter="url(#s)"><path d="M110 210l205-90 205 90-205 91z" fill="#dce8f0" stroke="#102d50" stroke-width="2"/><path d="M110 210v126l205 93V301z" fill="#102d50"/><path d="M520 210v126l-205 93V301z" fill="#183e64"/><text x="315" y="207" text-anchor="middle" font-size="23" font-weight="900" fill="#102d50">FRONTEND</text><text x="315" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#102d50">Next.js 15 · React 19</text></g><g filter="url(#s)"><path d="M650 210l205-90 205 90-205 91z" fill="#dff1c8" stroke="#70b91c" stroke-width="2"/><path d="M650 210v126l205 93V301z" fill="#163655"/><path d="M1060 210v126l-205 93V301z" fill="#20486c"/><text x="855" y="207" text-anchor="middle" font-size="23" font-weight="900" fill="#102d50">API LAYER</text><text x="855" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#102d50">Spring Boot 4 · Java 25</text></g><path d="M520 270H650" stroke="#70d522" stroke-width="5" marker-end="url(#a)" stroke-dasharray="12 12"><animate attributeName="stroke-dashoffset" from="0" to="-96" dur="3s" repeatCount="indefinite"/></path><text x=