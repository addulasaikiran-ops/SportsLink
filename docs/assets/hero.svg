<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-labelledby="title desc">
<title id="title">SPORTSLINK's animated bot squad</title><desc id="desc">All twelve detailed mini-voxel bot illustrations from the project are lined up on a small strip of grass. Each bot gently bounces, and a pixel football moves between them. The rest of the background is transparent.</desc>
